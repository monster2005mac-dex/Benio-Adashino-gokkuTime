<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — Gokaku 合格</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 85% 10%, #17132b 0, transparent 35%), #080911;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .mono {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .page {
    width: 100%;
    max-width: 420px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.18em;
    color: #c4b5fd;
    margin-bottom: 18px;
  }

  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.2;
    color: #f8fafc;
    margin-bottom: 14px;
  }
  h1 span { color: #a78bfa; }

  .lede {
    font-size: 14px;
    line-height: 1.7;
    color: #94a3b8;
    margin-bottom: 32px;
  }

  .frame {
    position: relative;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 28px 24px;
    background: rgba(18,20,36,0.88);
    box-shadow: 0 24px 80px rgba(0,0,0,.42), 0 0 30px rgba(139,92,246,.08);
  }

  .frame::before, .frame::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
  }
  .frame::before {
    top: -1px; left: -1px;
    border-top: 1.5px solid rgba(241,237,225,0.35);
    border-left: 1.5px solid rgba(241,237,225,0.35);
  }
  .frame::after {
    top: -1px; right: -1px;
    border-top: 1.5px solid rgba(241,237,225,0.35);
    border-right: 1.5px solid rgba(241,237,225,0.35);
  }
  .frame .br-bl {
    position: absolute; bottom: -1px; left: -1px;
    width: 18px; height: 18px;
    border-bottom: 1.5px solid rgba(241,237,225,0.35);
    border-left: 1.5px solid rgba(241,237,225,0.35);
  }
  .frame .br-br {
    position: absolute; bottom: -1px; right: -1px;
    width: 18px; height: 18px;
    border-bottom: 1.5px solid rgba(241,237,225,0.35);
    border-right: 1.5px solid rgba(241,237,225,0.35);
  }

  .field-label {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: #6B6A60;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .field { margin-bottom: 20px; }

  .field input {
    width: 100%;
    padding: 12px 14px;
    background: #0F0C09;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px;
    font-size: 15px;
    color: #F1EDE1;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field input::placeholder { color: #4A4944; }
  .field input:focus {
    border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.14);
  }
  .field .hint {
    font-size: 11.5px;
    color: #6B6A60;
    margin-top: 6px;
  }

  .password-wrap {
    position: relative;
  }
  .password-wrap input {
    padding-right: 44px;
  }
  .toggle-password {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #6B6A60;
    padding: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .toggle-password:hover { color: #9C9A90; }
  .toggle-password svg { display: block; }
  .toggle-password .eye-off { display: none; }
  .toggle-password.showing .eye { display: none; }
  .toggle-password.showing .eye-off { display: block; }

  .error-msg {
    font-size: 12.5px;
    color: #E29A5A;
    margin: -10px 0 16px;
    line-height: 1.5;
  }

  .submit-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 3px;
    background: linear-gradient(135deg, #8b5cf6, #e11d48);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .submit-btn:hover { filter: brightness(1.12); }
  .submit-btn:disabled { opacity: 0.6; cursor: default; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: #4A4944;
    font-size: 11px;
    letter-spacing: 0.1em;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.08);
  }

  .google-btn {
    width: 100%;
    padding: 12px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.1);
    background: transparent;
    color: #F1EDE1;
    font-size: 14px;
    cursor: pointer;
  }
  .google-btn:hover { background: rgba(255,255,255,0.03); }

  .login-line {
    text-align: center;
    margin-top: 26px;
    font-size: 13px;
    color: #6B6A60;
  }
  .login-line a {
    color: #8FB542;
    text-decoration: none;
  }
  .login-line a:hover { text-decoration: underline; }
</style>
</head>
<body>

  <div class="page">
    <p class="eyebrow mono">GOKAKU 合格 • OCCULT CLUB OS</p>
    <h1>Join the<br /><span>peerage.</span></h1>
    <p class="lede mono">Create your private account for quests, focus rituals, and a timetable that feels like yours.</p>

    <div class="frame">
      <div class="br-bl"></div>
      <div class="br-br"></div>

      <form id="signupForm">
        <div class="field">
          <p class="field-label mono">Player name</p>
          <input type="text" id="username" placeholder="fieldname" required minlength="3" maxlength="20" autocomplete="username" />
          <p class="hint mono">A display name for your Gokaku profile.</p>
        </div>

        <div class="field">
          <p class="field-label mono">Email</p>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="field">
          <p class="field-label mono">Password</p>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="••••••••" required autocomplete="new-password" />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
              <svg class="eye" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
              <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c7 0 10.5 7 10.5 7a13.2 13.2 0 0 1-3.1 3.9M6.6 6.6C3.4 8.8 1.5 12 1.5 12S5 19 12 19c1.4 0 2.6-.3 3.7-.7M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <p class="hint mono">At least 6 characters.</p>
        </div>

        <div class="field">
          <p class="field-label mono">Owner PIN</p>
          <input type="password" id="ownerPin" placeholder="6-digit private PIN" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" />
        </div>

        <p class="error-msg mono" id="errorMsg" style="display:none;"></p>

        <button type="submit" class="submit-btn" id="submitBtn">Create account</button>
      </form>

      <div class="divider mono">OR</div>

      <button type="button" class="google-btn" id="googleBtn">Continue with Google</button>
    </div>

    <p class="login-line mono">Already have an account? <a href="index.html">Log in</a></p>
  </div>

  <!-- Firebase (modular v10 SDK via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      sendEmailVerification,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      collection,
      query,
      where,
      getDocs,
      serverTimestamp,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Firebase project used by the Gokaku login page.
    const firebaseConfig = {
      apiKey: "AIzaSyAVh0JQWACc0HPTlhSI7hl8pJvVEi-WPxM",
      authDomain: "gokaku-1081d.firebaseapp.com",
      projectId: "gokaku-1081d",
      storageBucket: "gokaku-1081d.firebasestorage.app",
      messagingSenderId: "742590001331",
      appId: "1:742590001331:web:7c796e57294b34633140c6",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("signupForm");
    const submitBtn = document.getElementById("submitBtn");
    const errorMsg = document.getElementById("errorMsg");
    const googleBtn = document.getElementById("googleBtn");
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");
    const ownerPinInput = document.getElementById("ownerPin");
    const OWNER_PIN = "739184";
    const PIN_SESSION_KEY = "gokaku_pin_verified";
    const isValidOwnerPin = (value) => /^\d{6}$/.test(value) && value === OWNER_PIN;

    const REDIRECT_URL = "profile.html";
    const USERNAME_RE = /^[a-zA-Z0-9_]{3,20}$/;

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.style.display = "block";
    }
    function clearError() {
      errorMsg.style.display = "none";
      errorMsg.textContent = "";
    }

    // Looks up the "users" collection for an existing username (case-insensitive).
    async function isUsernameTaken(usernameLower) {
      const usersRef = collection(db, "users");
      const q = query(usersRef, where("username_lower", "==", usernameLower));
      const snap = await getDocs(q);
      return !snap.empty;
    }

    async function createUserDoc(user, username) {
      const userRef = doc(db, "users", user.uid);
      const existing = await getDoc(userRef);
      if (!existing.exists()) {
        await setDoc(userRef, {
          email: user.email,
          username: username || null,
          username_lower: username ? username.toLowerCase() : null,
          createdAt: serverTimestamp(),
        });
      }
    }

    // Turns a Google display name (e.g. "Jane Doe") into a valid,
    // available username (e.g. "jane_doe"), falling back to the email
    // prefix if there's no display name, and appending numbers if the
    // first choice is already taken.
    async function usernameFromGoogleProfile(user) {
      const source = user.displayName || (user.email ? user.email.split("@")[0] : "") || "user";
      let base = source
        .trim()
        .replace(/[^a-zA-Z0-9_]+/g, "_")
        .replace(/^_+|_+$/g, "")
        .slice(0, 20);
      if (base.length < 3) base = (base + "_user").slice(0, 20);

      let candidate = base;
      const usersRef = collection(db, "users");
      for (let i = 0; i < 6; i++) {
        const q = query(usersRef, where("username_lower", "==", candidate.toLowerCase()), limit(1));
        const snap = await getDocs(q);
        if (snap.empty) return candidate;
        const suffix = String(Math.floor(Math.random() * 9000) + 100);
        candidate = (base.slice(0, 20 - suffix.length) + suffix);
      }
      return candidate;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const ownerPin = ownerPinInput.value.trim();

      if (!username || !email || !password || !ownerPin) {
        showError("Enter a player name, email, password, and owner PIN.");
        return;
      }
      if (!isValidOwnerPin(ownerPin)) {
        showError("Invalid owner PIN.");
        return;
      }
      if (!USERNAME_RE.test(username)) {
        showError("Username must be 3–20 characters: letters, numbers, or underscores.");
        return;
      }
      if (password.length < 6) {
        showError("Password must be at least 6 characters.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";

      try {
        sessionStorage.setItem(PIN_SESSION_KEY, "1");
        const taken = await isUsernameTaken(username.toLowerCase());
        if (taken) {
          sessionStorage.removeItem(PIN_SESSION_KEY);
          showError("That username is already taken.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Create account";
          return;
        }

        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await createUserDoc(cred.user, username);

        // Google accounts arrive already verified — this path is only
        // for email/password signups, so fire off the verification email.
        try {
          await sendEmailVerification(cred.user);
        } catch (verifyErr) {
          console.error("Could not send verification email:", verifyErr);
        }

        window.location.href = REDIRECT_URL;
      } catch (err) {
        sessionStorage.removeItem(PIN_SESSION_KEY);
        console.error(err);
        showError(friendlyError(err.code));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
      }
    });

    googleBtn.addEventListener("click", async () => {
      clearError();
      if (!isValidOwnerPin(ownerPinInput.value.trim())) {
        showError("Enter the valid owner PIN before using Google sign-in.");
        return;
      }
      const provider = new GoogleAuthProvider();
      try {
        sessionStorage.setItem(PIN_SESSION_KEY, "1");
        const cred = await signInWithPopup(auth, provider);
        // Derive a username from the Google account's display name
        // (e.g. "Jane Doe" -> "jane_doe"), falling back to the email
        // prefix, and de-duping if it's already taken.
        const username = await usernameFromGoogleProfile(cred.user);
        await createUserDoc(cred.user, username);
        window.location.href = REDIRECT_URL;
      } catch (err) {
        sessionStorage.removeItem(PIN_SESSION_KEY);
        console.error("Google sign-in error:", err.code, err.message);
        showError(friendlyError(err.code) + " (" + err.code + ")");
      }
    });

    togglePassword.addEventListener("click", () => {
      const isShowing = passwordInput.type === "text";
      passwordInput.type = isShowing ? "password" : "text";
      togglePassword.classList.toggle("showing", !isShowing);
      togglePassword.setAttribute("aria-label", isShowing ? "Show password" : "Hide password");
    });

    function friendlyError(code) {
      switch (code) {
        case "auth/email-already-in-use":
          return "An account already exists with that email.";
        case "auth/invalid-email":
          return "That email address doesn't look right.";
        case "auth/weak-password":
          return "Password is too weak — use at least 6 characters.";
        case "auth/popup-closed-by-user":
          return "Google sign-in was closed before finishing.";
        case "auth/unauthorized-domain":
          return "This domain isn't authorized in Firebase yet — add it under Authentication > Settings > Authorized domains.";
        case "auth/operation-not-allowed":
          return "Google sign-in isn't enabled yet — turn it on under Authentication > Sign-in method.";
        case "auth/popup-blocked":
          return "Your browser blocked the popup — allow popups for this site and try again.";
        default:
          return "Something went wrong. Please try again.";
      }
    }
  </script>

</body>
</html>
